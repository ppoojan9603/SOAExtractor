[project]
name = "soa-extractor"
version = "0.1.0"
description = "Locate and extract Schedule of Activities tables from clinical trial protocol PDFs"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11",
    "pypdfium2>=4",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
enrich = ["anthropic>=0.40"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["needs_pdfs: requires the sample protocol PDFs in data/protocols/"]
